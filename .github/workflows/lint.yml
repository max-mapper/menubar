name: Linting

on:
    push:
        branches:
            - master
    pull_request:

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
            - run: yarn install
            - run: yarn lint
